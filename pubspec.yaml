name: remedibook
description: A new Flutter project for Gemini 3 Hackathon - Premium Biophilic Wellness.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_generative_ai: ^0.4.0
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_riverpod: ^2.5.1
  url_launcher: ^6.2.1
  google_fonts: ^6.2.1
  rive: ^0.13.5
  flutter_svg: ^2.0.9
  flutter_staggered_grid_view: ^0.7.0
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash_logo.png
    - assets/images/background_motif.png
    - assets/images/ginger_tulsi_macro.png
    - assets/images/splash_logo_updated.gif.gif
    - assets/data/expert_vault.csv